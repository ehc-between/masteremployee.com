# Pre-certificate state: no certs on disk yet.
#
# Serves the site over plain HTTP and exposes the ACME challenge path so certbot
# can complete the webroot validation. The entrypoint swaps this file out for
# tls.conf as soon as a usable certificate appears.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name masteremployee.com www.masteremployee.com _;

    include /etc/nginx/snippets/common.conf;
    include /etc/nginx/snippets/site.conf;
}
