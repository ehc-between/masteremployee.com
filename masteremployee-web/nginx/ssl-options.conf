# Modern TLS parameters, baked into the image.
# Previously this was `include /etc/letsencrypt/options-ssl-nginx.conf`, which only
# existed on the host after init-letsencrypt.sh had run -- so nginx could not boot
# on a fresh machine. Shipping it in the image removes that bootstrap dependency.

ssl_session_cache shared:le_nginx_SSL:10m;
ssl_session_timeout 1440m;
ssl_session_tickets off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

# ECDHE-only, so no ssl_dhparam / ssl-dhparams.pem is required.
ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
