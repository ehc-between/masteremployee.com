# Post-certificate state: a valid cert for masteremployee.com is on disk.
#
# Port 80 keeps serving the ACME challenge (required for renewals) and redirects
# everything else. www is redirected to the apex over TLS.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name masteremployee.com www.masteremployee.com _;

    include /etc/nginx/snippets/common.conf;

    location / {
        return 301 https://masteremployee.com$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name www.masteremployee.com;

    ssl_certificate     /etc/letsencrypt/live/masteremployee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masteremployee.com/privkey.pem;
    include /etc/nginx/snippets/ssl-options.conf;

    return 301 https://masteremployee.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name masteremployee.com;

    ssl_certificate     /etc/letsencrypt/live/masteremployee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masteremployee.com/privkey.pem;
    include /etc/nginx/snippets/ssl-options.conf;

    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/masteremployee.com/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/common.conf;
    include /etc/nginx/snippets/site.conf;
}
