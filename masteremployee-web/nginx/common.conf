# Included by every server block, in both the HTTP-only and TLS states.

# Webroot path certbot writes its challenge files to. Must stay reachable over
# plain HTTP at all times, including during renewals.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
}

# Container healthcheck target. Answers 200 locally in both states, so the check
# never has to follow the HTTP->HTTPS redirect.
location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
}
